
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Games Editor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#191919;color:white;font-family:Arial,sans-serif;padding:30px}
main{max-width:850px;margin:auto}
h1 span{color:#9565e9}
.panel{background:#242424;padding:22px;border-radius:12px;margin:20px 0}
input,textarea{width:100%;padding:12px;margin:7px 0 15px;background:#303030;color:white;border:1px solid #444;border-radius:7px}
textarea{resize:vertical;min-height:65px}
button{padding:11px 16px;border:0;border-radius:7px;background:#9565e9;color:white;cursor:pointer;font-weight:bold;margin:4px}
button:hover{filter:brightness(1.15)}
.delete{background:#a83c3c}
.game{display:flex;align-items:center;gap:15px;border-bottom:1px solid #444;padding:12px 0}
.game img{width:100px;height:65px;object-fit:cover;border-radius:6px}
.game-info{flex:1;min-width:0}
.game-info p{color:#aaa;margin:5px 0}
#preview{max-width:180px;max-height:110px;display:none;border-radius:8px;margin:5px 0}
</style>
</head>
<body>
<main>
<h1><span>Hero</span> Games <small>Editor</small></h1>
<p>Gerencie sua biblioteca de jogos.</p>

<section class="panel">
<h2 id="form-title">Adicionar jogo</h2>
<form id="game-form">
<label>Nome</label>
<input id="name" required placeholder="Nome do jogo">

<label>Categoria</label>
<input id="category" required placeholder="Ex.: FPS">

<label>Descrição</label>
<textarea id="description" required placeholder="Descrição do jogo"></textarea>

<label>Link do jogo</label>
<input id="url" type="url" required placeholder="https://...">

<label>Imagem da capa</label>
<input id="image-file" type="file" accept="image/*">
<img id="preview" alt="Prévia da capa">

<button type="submit" id="save-button">Adicionar jogo</button>
<button type="button" onclick="resetForm()">Cancelar</button>
</form>
</section>

<section class="panel">
<h2>Minha biblioteca</h2>
<div id="games-list"></div>
</section>

<section class="panel">
<h2>Publicar alterações</h2>
<p>Baixe o catálogo e envie o arquivo para o GitHub.</p>
<button onclick="exportGames()">Exportar catálogo JSON</button>
<button onclick="resetAll()">Restaurar catálogo original</button>
</section>
</main>

<script>
const originalGames = [
{name:"Subway Surfers",category:"Mobile Ports",description:"Corra pelos trilhos e fuja do guarda.",image:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=700",url:"https://poki.com/br/g/subway-surfers"},
{name:"Minecraft Classic",category:"Clássicos",description:"Construa seu próprio mundo.",image:"https://images.unsplash.com/photo-1607513746994-51f730a44832?w=700",url:"https://classic.minecraft.net/"},
{name:"Krunker",category:"FPS",description:"FPS multiplayer no navegador.",image:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=700",url:"https://krunker.io/"},
{name:"Slither.io",category:"Multiplayer",description:"Cresça e domine o mapa.",image:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=700",url:"https://slither.io/"},
{name:"Temple Run 2",category:"Mobile Ports",description:"Fuja pelas ruínas antigas.",image:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=700",url:"https://poki.com/br/g/temple-run-2"},
{name:"Agar.io",category:"Multiplayer",description:"Coma células e fique gigante.",image:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=700",url:"https://agar.io/"},
{name:"Cookie Clicker",category:"Clássicos",description:"Construa um império de biscoitos.",image:"https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=700",url:"https://orteil.dashnet.org/cookieclicker/"},
{name:"Shell Shockers",category:"FPS",description:"Um FPS com personagens de ovos.",image:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=700",url:"https://shellshock.io/"},
{name:"2048",category:"Puzzle",description:"Combine números até chegar a 2048.",image:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=700",url:"https://play2048.co/"},
{name:"Crossy Road",category:"Mobile Ports",description:"Atravesse ruas e rios.",image:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=700",url:"https://poki.com/br/g/crossy-road"}
];

let games;
try {
  games = JSON.parse(localStorage.getItem("heroGames")) || originalGames;
} catch {
  games = originalGames;
}

let editing = -1;
let selectedImage = "";

const $ = id => document.getElementById(id);

function persist() {
  localStorage.setItem("heroGames", JSON.stringify(games));
  render();
}

function render() {
  $("games-list").innerHTML = "";

  games.forEach((game, index) => {
    const item = document.createElement("div");
    item.className = "game";

    const img = document.createElement("img");
    img.src = game.image;
    img.alt = "";

    const info = document.createElement("div");
    info.className = "game-info";

    const title = document.createElement("strong");
    title.textContent = game.name;

    const desc = document.createElement("p");
    desc.textContent = game.category;

    info.append(title, desc);

    const actions = document.createElement("div");

    const edit = document.createElement("button");
    edit.textContent = "Editar";
    edit.onclick = () => editGame(index);

    const del = document.createElement("button");
    del.textContent = "Excluir";
    del.className = "delete";
    del.onclick = () => {
      if (confirm("Excluir " + game.name + "?")) {
        games.splice(index, 1);
        persist();
        resetForm();
      }
    };

    actions.append(edit, del);
    item.append(img, info, actions);
    $("games-list").append(item);
  });
}

function resetForm() {
  editing = -1;
  selectedImage = "";
  $("game-form").reset();
  $("preview").style.display = "none";
  $("form-title").textContent = "Adicionar jogo";
  $("save-button").textContent = "Adicionar jogo";
}

function editGame(index) {
  const game = games[index];
  editing = index;
  $("name").value = game.name;
  $("category").value = game.category;
  $("description").value = game.description;
  $("url").value = game.url;
  selectedImage = game.image;

  $("preview").src = game.image;
  $("preview").style.display = "block";
  $("form-title").textContent = "Editar jogo";
  $("save-button").textContent = "Salvar edição";
  window.scrollTo({top:0,behavior:"smooth"});
}

$("image-file").addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Escolha um arquivo de imagem.");
    return;
  }

  if (file.size > 8 * 1024 * 1024) {
    alert("A imagem deve ter menos de 8 MB.");
    event.target.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const scale = Math.min(900 / img.width, 600 / img.height, 1);
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      selectedImage = canvas.toDataURL("image/jpeg", 0.78);
      $("preview").src = selectedImage;
      $("preview").style.display = "block";
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

$("game-form").addEventListener("submit", event => {
  event.preventDefault();

  const game = {
    name: $("name").value.trim(),
    category: $("category").value.trim(),
    description: $("description").value.trim(),
    image: selectedImage || (editing >= 0 ? games[editing].image : ""),
    url: $("url").value.trim()
  };

  if (!game.image) {
    alert("Escolha uma imagem para o jogo.");
    return;
  }

  if (editing >= 0) games[editing] = game;
  else games.push(game);

  persist();
  resetForm();
});

function exportGames() {
  const blob = new Blob([JSON.stringify(games, null, 2)], {
    type:"application/json"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "games.json";
  link.click();
  URL.revokeObjectURL(link.href);
}

function resetAll() {
  if (!confirm("Restaurar os 10 jogos originais? Suas alterações serão perdidas.")) return;
  games = JSON.parse(JSON.stringify(originalGames));
  persist();
  resetForm();
}

render();
</script>
</body>
</html>
